plugins {
    id 'java'
    id 'org.springframework.boot' version '2.1.4.RELEASE'

}

group 'bakery'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    
    implementation 'org.springframework.boot:spring-boot-starter-web:2.1.4.RELEASE'

    //AWS
    implementation platform('software.amazon.awssdk:bom:2.10.56')
    implementation 'software.amazon.awssdk:dynamodb'
    implementation 'software.amazon.awssdk:dynamodb-enhanced:2.12.0'
    implementation 'software.amazon.awssdk:s3'

    // https://mvnrepository.com/artifact/com.amazonaws/aws-java-sdk-dynamodb
    implementation group: 'com.amazonaws', name: 'aws-java-sdk-dynamodb', version: '1.11.940'

    //security
	implementation group: 'io.jsonwebtoken', name: 'jjwt', version: '0.7.0'
	implementation group: 'org.springframework.security', name: 'spring-security-core', version: '5.1.5.RELEASE'
	implementation group: 'org.springframework.security', name: 'spring-security-config', version: '3.2.0.RELEASE'
	implementation group: 'org.springframework.security', name: 'spring-security-web', version: '5.0.6.RELEASE'
    //mail
    implementation group: 'org.springframework.boot', name: 'spring-boot-starter-mail', version: '2.1.4.RELEASE'
    //format
	implementation group: 'org.springframework.hateoas', name: 'spring-hateoas', version: '0.23.0.RELEASE'
    implementation group: 'com.google.code.gson', name: 'gson', version: '2.7'
    implementation group: 'javax.xml.bind', name: 'jaxb-api', version: '2.2.4'
    implementation group: 'org.projectlombok', name: 'lombok', version: '1.18.12'

    //test
    testImplementation group: 'org.springframework.boot', name: 'spring-boot-starter-test', version: '2.1.4.RELEASE'
    testImplementation 'junit:junit:4.13.2'
    // https://mvnrepository.com/artifact/org.slf4j/slf4j-api
    implementation group: 'org.slf4j', name: 'slf4j-api', version: '1.7.25'


}

