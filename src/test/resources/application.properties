# Tests run against an in-memory database; Hibernate creates the schema so the
# Flyway migration (PostgreSQL specific) is not applied here.
spring.datasource.url=jdbc:h2:mem:bakery;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false

spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@example.com
spring.mail.password=test

jwt.secret=test-secret-used-only-by-the-test-suite-not-for-production-use
cors.allowed.origins=http://localhost:3000
